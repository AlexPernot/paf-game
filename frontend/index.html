<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le jeu de la note</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="app">
    <header id="app-header">
      <button type="button" class="btn-back" id="header-back">‹ Retour</button>
      <h1 class="title title-small">LE JEU DE LA NOTE</h1>
    </header>

    <section id="screen-title" class="screen" data-screen="title">
      <button type="button" class="btn-upload" id="header-upload">Ajouter des joueurs</button>
      <h1 class="title">LE JEU DE LA NOTE</h1>
      <div class="mode-buttons">
        <button type="button" class="btn btn-mode" data-mode="notes">Uniquement les films notés</button>
        <button type="button" class="btn btn-mode" data-mode="vus">Tous les films regardés</button>
      </div>
    </section>

    <dialog id="upload-dialog">
      <form id="upload-form">
        <h2>Ajouter des joueurs</h2>
        <div id="upload-rows"></div>
        <button type="button" class="btn" id="upload-add-row">+ Ajouter un joueur</button>
        <p class="upload-status" id="upload-status"></p>
        <div class="upload-actions">
          <button type="button" class="btn" id="upload-cancel">Annuler</button>
          <button type="submit" class="btn" id="upload-submit">Envoyer</button>
        </div>
      </form>
    </dialog>

    <section id="screen-picker" class="screen" data-screen="picker">
      <div class="card-grid" id="card-grid"></div>
      <div class="random-buttons">
        <button type="button" class="btn btn-random" data-mode="notes">🎲 uniquement les films notés</button>
        <button type="button" class="btn btn-random" data-mode="vus">🎲 tous les films regardés</button>
      </div>
    </section>

    <section id="screen-reveal" class="screen" data-screen="reveal">
      <div class="reveal-layout">
        <div class="reveal-main">
          <h2 class="movie-title" id="movie-title"></h2>
          <div class="ratings-row" id="ratings-row"></div>
          <button type="button" class="btn-big-red" id="big-red-button"></button>
          <div class="reveal-container" id="reveal-container">
            <h2>Débattez !</h2>
            <button type="button" class="btn btn-reveal" id="reveal-button">Révéler les notes</button>
          </div>
        </div>
        <aside class="movie-info">
          <img class="movie-poster" id="movie-poster" alt="">
          <p class="movie-overview" id="movie-overview"></p>
          <p class="movie-meta" id="movie-meta"></p>
        </aside>
      </div>
    </section>
  </div>

  <script>window.BACKEND_URL = '{{env "BACKEND_URL"}}';</script>
  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
